[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alcohol-label-verification-api"
version = "0.1.0"
description = "API for the alcohol label verification prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "openai>=2.26,<3",
    "pillow>=12,<13",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
